<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d16">
<meta name="color-scheme" content="dark light">
<script>
  // Tema ilk boyamadan önce uygulanır (yanıp sönme olmasın). Tercih: gündüz | gece; seçim yoksa cihaz ayarı.
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('dentsimco.tema') || 'auto'; } catch (e) { /* gizli sekme */ }
    var light = t === 'light' || (t !== 'dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  })();
</script>
<title>DentSimco</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2303060c'/%3E%3Cpath d='M5 21l6-6 5 4 6-9 5 5' fill='none' stroke='%233cefff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
  /* Renkler: gece teması (varsayılan; neon hafifçe kısıldı) ve gündüz teması. Her renk bu değişkenlerden gelir. */
  :root, :root[data-theme="dark"] {
    --bg: #080d16;
    --surface: #0d1420;
    --raise: #131c2b;
    --raise-2: #19243a;
    --line: #1f2c42;
    --line-2: #2a3a56;
    --line-3: #3a527a;
    --text: #d6e0ee;
    --muted: #8d9bb0;
    --faint: #66758d;
    --accent: #84c4ec;
    --on-accent: #06121c;
    --price: #55d3e4;
    --up: #52d89b;
    --down: #f0687f;
    --late: #ebb552;
    --low: #6fd98c;
    --high: #ebb552;
    --tint-bg: #12304a;
    --tint-line: #24507a;
    --up-bg: #0b2d22;
    --up-line: #14583f;
    --down-bg: #2e1420;
    --down-line: #5a2a3c;
    --down-text: #f4b4c0;
    --late-bg: #2a2410;
    --late-line: #5a4a20;
    --pop: #0f1827;
    --overlay: rgba(4, 8, 14, 0.7);
    --shadow: rgba(0, 0, 0, 0.5);
    --hover: rgba(132, 196, 236, 0.05);
    --sel: rgba(132, 196, 236, 0.10);
    --row-line: rgba(31, 44, 66, 0.7);
    --s-price: #55d3e4;
    --s-low: #6fd98c;
    --s-high: #ebb552;
    --s-vwap: #e277cf;
    --s-vol: #5b8ae8;
    --s-total: #94a6e8;
    --chart-grid: rgba(132, 170, 225, 0.09);
    --chart-base: rgba(132, 170, 225, 0.24);
    --chart-day: rgba(132, 196, 236, 0.14);
    --chart-label: #7f93ae;
    --chart-cross: rgba(132, 196, 236, 0.5);
    --chart-pill: #172540;
    --chart-pill-text: #e1eaf6;
    --chart-ring: #0d1420;
    --chart-tag-text: #04141b;
    --chart-glow: 0.55;
    --d5-bg: #0b2d22; --d5-fg: #3fcf9a; --d5-line: #14583f;
    --d4-bg: #1d2b0f; --d4-fg: #a3d93f; --d4-line: #3a5a1a;
    --d3-bg: #2b2408; --d3-fg: #e6c542; --d3-line: #5c4b12;
    --d2-bg: #33200e; --d2-fg: #f09a52; --d2-line: #6b3a14;
    --d1-bg: #2e1420; --d1-fg: #ee7a8c; --d1-line: #5a2a3c;
    --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-c: "Barlow Semi Condensed", "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  /* Gündüz: açık zemin, lacivert metin, mavi vurgu; yükselişte yeşil, düşüşte kırmızı (borsa ekranlarındaki gibi). Parlama yok. */
  :root[data-theme="light"] {
    --bg: #f1f4f9;
    --surface: #ffffff;
    --raise: #f5f7fb;
    --raise-2: #e8edf6;
    --line: #dce3ee;
    --line-2: #c8d2e3;
    --line-3: #9db0cd;
    --text: #0e2347;
    --muted: #4a5c7a;
    --faint: #5f6f8a;
    --accent: #0a4fa8;
    --on-accent: #ffffff;
    --price: #0b5bbd;
    --up: #0d7a3a;
    --down: #c62f3b;
    --late: #9a5b00;
    --low: #0d7a3a;
    --high: #9a5b00;
    --tint-bg: #e3edfb;
    --tint-line: #b3cbee;
    --up-bg: #e1f4e8;
    --up-line: #a3d6b8;
    --down-bg: #fdebed;
    --down-line: #f0b6bd;
    --down-text: #8f1f2a;
    --late-bg: #fff2d9;
    --late-line: #ecd096;
    --pop: #ffffff;
    --overlay: rgba(14, 35, 71, 0.45);
    --shadow: rgba(14, 35, 71, 0.18);
    --hover: rgba(10, 79, 168, 0.05);
    --sel: rgba(10, 79, 168, 0.09);
    --row-line: rgba(14, 35, 71, 0.10);
    --s-price: #0b5bbd;
    --s-low: #0d7a3a;
    --s-high: #b86f00;
    --s-vwap: #b0348f;
    --s-vol: #4a74d6;
    --s-total: #8da3d6;
    --chart-grid: rgba(14, 35, 71, 0.08);
    --chart-base: rgba(14, 35, 71, 0.26);
    --chart-day: rgba(10, 79, 168, 0.16);
    --chart-label: #566782;
    --chart-cross: rgba(10, 79, 168, 0.5);
    --chart-pill: #0e2347;
    --chart-pill-text: #ffffff;
    --chart-ring: #ffffff;
    --chart-tag-text: #ffffff;
    --chart-glow: 0;
    --d5-bg: #dff3e8; --d5-fg: #0b6b3a; --d5-line: #a3d6b8;
    --d4-bg: #eef6d8; --d4-fg: #4f6d0a; --d4-line: #cde297;
    --d3-bg: #fdf3cf; --d3-fg: #6e5200; --d3-line: #ead186;
    --d2-bg: #fde9d8; --d2-fg: #944508; --d2-line: #f0c196;
    --d1-bg: #fde3e7; --d1-fg: #a32636; --d1-line: #f0b0ba;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); color: var(--text); font: 400 16px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .price, .chg, dd, td, .lg-val, .product-id, .pid, .dayrange, .qtag { font-variant-numeric: tabular-nums; }

  /* Üst menü */
  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    max-width: 1240px; margin: 0 auto; padding: 14px 20px 12px;
  }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--text); text-decoration: none; font: 600 21px/1 var(--font-c); }
  .brand svg { width: 24px; height: 24px; }
  .modules { display: flex; gap: 2px; }
  .modules a { padding: 8px 12px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 500; }
  .modules a:hover { color: var(--text); }
  .modules a[aria-current="page"] { color: var(--text); background: var(--raise); }
  .subnav { display: none; gap: 2px; padding: 6px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .subnav.on { display: flex; }
  .subnav a { padding: 7px 12px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
  .subnav a:hover { color: var(--text); }
  .subnav a[aria-current="page"] { color: var(--text); background: var(--raise); }
  .realm { margin-left: auto; display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 11px; }
  .realm button { min-width: 44px; height: 32px; padding: 0 10px; border-radius: 8px; color: var(--muted); font: 600 15px/1 var(--font-c); }
  .realm button[aria-pressed="true"] { background: var(--raise-2); color: var(--accent); }
  .realm .theme-btn { min-width: 38px; margin-left: 2px; border-left: 1px solid var(--line); border-radius: 0 8px 8px 0; display: grid; place-items: center; color: var(--muted); }
  .realm .theme-btn svg { width: 18px; height: 18px; }
  .realm .theme-btn:hover { color: var(--text); }
  .about { padding: 6px 9px; border-radius: 9px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .about:hover { color: var(--text); }
  .about[aria-current="page"] { color: var(--text); background: var(--raise); }
  @media (max-width: 600px) {
    .top { padding: 12px 14px 8px; column-gap: 8px; }
    .about { padding: 6px 4px; font-size: 13px; }
    .modules { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
  }

  @media (max-width: 440px) { .realm button { min-width: 36px; padding: 0 6px; } .realm .theme-btn { min-width: 34px; } .brand { font-size: 18px; gap: 7px; } .brand svg { width: 22px; height: 22px; } .about { font-size: 12px; padding: 6px 2px; } }
  @media (max-width: 380px) { .top { padding-left: 10px; padding-right: 10px; column-gap: 6px; } .realm button { min-width: 32px; padding: 0 4px; } .realm .theme-btn { min-width: 32px; } .brand { font-size: 17px; gap: 6px; } .brand svg { width: 20px; height: 20px; } .about { font-size: 11.5px; } }

  main { max-width: 1240px; margin: 0 auto; padding: 4px 20px 48px; }
  @media (max-width: 600px) { main { padding: 2px 12px 40px; } }

  /* Borsa düzeni */
  .borsa { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "alert" "hero" "sinyal" "plot" "quality"; }
  .bar { grid-area: bar; }
  .alert { grid-area: alert; }
  .hero { grid-area: hero; }
  .plot { grid-area: plot; }
  .quality { grid-area: quality; }
  .sg-wrap { grid-area: sinyal; min-width: 0; }
  @media (min-width: 1180px) {
    .borsa { grid-template-columns: minmax(0, 1fr) 500px; grid-template-areas: "bar bar" "alert alert" "hero quality" "sinyal quality" "plot quality"; align-items: start; }
    .quality { position: sticky; top: 16px; }
  }

  /* Ürün ve kalite */
  .pick { position: relative; }
  .product {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 10px 14px;
    border: 1px solid var(--line-2); border-radius: 12px; background: var(--raise); text-align: left;
  }
  .product:hover { border-color: var(--line-3); }
  .product-name { font-weight: 600; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .product-id { color: var(--faint); font: 500 15px var(--font-c); }
  .chev { margin-left: auto; flex: none; color: var(--muted); }
  .product[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .picker {
    position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; right: 0; max-width: 560px;
    padding: 8px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--pop);
    box-shadow: 0 18px 48px var(--shadow);
  }
  .picker input {
    width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 9px;
    background: var(--bg); outline: none;
  }
  .picker input:focus { border-color: var(--accent); }
  .picker-list { max-height: min(60vh, 440px); overflow-y: auto; overscroll-behavior: contain; margin-top: 6px; }
  .picker-list [data-id] {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
    min-height: 42px; padding: 8px 10px; border-radius: 8px; text-align: left;
  }
  .picker-list [data-id]:hover, .picker-list [data-id]:focus-visible { background: var(--raise-2); outline: none; }
  .picker-list [aria-selected="true"] { color: var(--accent); }
  .pid { color: var(--faint); font: 500 14px var(--font-c); }
  .picker-group { margin: 10px 10px 4px; font-size: 13px; color: var(--faint); }
  .picker-empty { margin: 14px 10px; color: var(--muted); }

  .quals { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
  .quals::-webkit-scrollbar, .ranges::-webkit-scrollbar, .modules::-webkit-scrollbar, .subnav::-webkit-scrollbar { display: none; }
  .quals button {
    flex: none; min-width: 46px; height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); font: 600 15px/1 var(--font-c);
  }
  .quals button.empty { color: var(--faint); border-style: dashed; }
  .quals button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .alert {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 14px;
    border: 1px solid var(--down-line); border-radius: 12px; background: var(--down-bg); color: var(--down-text);
  }
  .btn { flex: none; height: 36px; padding: 0 14px; border-radius: 9px; background: var(--down-bg); color: var(--down-text); border: 1px solid var(--down-line); font-weight: 600; }

  /* Başlık ve fiyat */
  .hero { padding: 2px 2px 0; }
  .hero-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
  .hero-title { margin: 0; font-size: 23px; font-weight: 600; line-height: 1.2; }
  .qtag { margin-left: 4px; padding: 1px 7px; border: 1px solid var(--line-2); border-radius: 7px; color: var(--accent); font: 600 15px/1.4 var(--font-c); vertical-align: 2px; }
  .qtag:empty { display: none; }
  .fresh { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .fresh[data-level="live"] .dot { background: var(--up); box-shadow: 0 0 0 4px var(--up-bg); }
  .fresh[data-level="late"] .dot { background: var(--late); }
  .fresh[data-level="stale"] .dot { background: var(--down); }
  .fresh[data-level="stale"] { color: var(--down-text); }
  .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; color: var(--muted); }
  .icon-btn:hover { background: var(--raise); color: var(--text); }
  .icon-btn.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hero-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 6px 0 0; }
  .price { color: var(--price); font: 600 clamp(44px, 9vw, 64px)/1 var(--font-c); letter-spacing: -0.01em; }
  .price.none { color: var(--faint); font-size: clamp(32px, 6vw, 44px); }
  .chg { color: var(--muted); font: 600 18px/1 var(--font-c); }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }
  .lt { color: var(--muted); font: 500 15px/1 var(--font-c); }

  .dayrange {
    display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; align-items: center; gap: 3px 14px;
    max-width: 560px; margin-top: 16px; font: 600 16px var(--font-c);
  }
  .dr-cap { font: 400 13px var(--font); color: var(--muted); }
  .dr-end, .dr-hi { text-align: right; }
  .dr-lo { color: var(--low); }
  .dr-hi { color: var(--high); }
  .track { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--low) 38%, transparent), color-mix(in srgb, var(--high) 38%, transparent)); }
  .mark { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--price); box-shadow: 0 0 0 3px var(--bg), 0 0 calc(12px * var(--chart-glow)) color-mix(in srgb, var(--price) 60%, transparent); transform: translate(-50%, -50%); transition: left 0.42s cubic-bezier(0.65, 0, 0.35, 1); }

  .figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin: 18px 0 0; }
  @media (min-width: 640px) { .figs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .figs div { padding-top: 8px; border-top: 1px solid var(--line); }
  .figs dt { font-size: 13px; color: var(--muted); }
  .figs dd { margin: 3px 0 0; font: 600 20px/1.2 var(--font-c); }

  /* Grafik */
  .plot { position: relative; padding: 12px 12px 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
  .plot::before { content: ""; position: absolute; top: 0; left: 0; height: 2px; width: 30%; background: var(--accent); opacity: 0; }
  .plot[aria-busy="true"]::before { opacity: 0.8; animation: busy 1.1s ease-in-out infinite; }
  @keyframes busy { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .ranges { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); overflow-x: auto; scrollbar-width: none; }
  .ranges button { flex: 1 1 0; min-width: 0; height: 36px; padding: 0 2px; border-radius: 8px; color: var(--muted); font: 600 15px/1 var(--font-c); white-space: nowrap; }
  .ranges button:hover { color: var(--text); }
  .ranges button[aria-checked="true"] { background: var(--raise-2); color: var(--accent); }
  .legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  @media (max-width: 600px) { .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .lg {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; min-height: 54px;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; text-align: left; transition: opacity 0.2s, border-color 0.2s;
  }
  .lg-head { display: flex; align-items: center; gap: 7px; font-size: 13px; line-height: 1.2; }
  .lg:hover { border-color: var(--line-2); }
  .lg[aria-pressed="false"] { opacity: 0.42; }
  .lg[aria-pressed="false"] .lg-label { text-decoration: line-through; }
  .sw { flex: none; width: 16px; border-top: 2px solid var(--c); }
  .sw.dash { border-top-style: dashed; }
  .sw.bar { width: 10px; height: 12px; border: 0; border-radius: 2px 2px 0 0; background: var(--c); }
  .lg-label { color: var(--muted); }
  .lg-val { font: 600 17px/1.1 var(--font-c); }
  .when { min-height: 20px; margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
  .chart { position: relative; height: clamp(270px, 46vh, 460px); margin: 4px -4px 0; touch-action: pan-y; }
  .chart-canvas { position: absolute; inset: 0; display: block; touch-action: pan-y; outline-offset: -2px; }
  .chart-msg { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; color: var(--muted); }
  .foot { margin: 8px 2px 0; font-size: 12.5px; line-height: 1.5; color: var(--faint); max-width: 76ch; }

  /* Kalite tablosu */
  .quality { padding: 14px 4px 6px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .quality-title { margin: 0 12px 8px; font-size: 16px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .qt { width: 100%; min-width: 400px; border-collapse: collapse; }
  .qt th, .qt td { padding: 0 9px; text-align: right; white-space: nowrap; }
  @media (max-width: 600px) { .qt th, .qt td { padding: 0 7px; } .sbar { display: none; } }
  .qt thead th { height: 34px; border-bottom: 1px solid var(--line); color: var(--faint); font-size: 13px; font-weight: 500; }
  .qt tbody th, .qt tbody td, .qt tfoot th, .qt tfoot td { height: 42px; font: 500 15px var(--font-c); }
  .qt tbody tr { border-bottom: 1px solid var(--row-line); cursor: pointer; }
  .qt tbody tr:hover { background: var(--hover); }
  .qt th:first-child { text-align: left; }
  .qt tbody th button { min-width: 44px; height: 32px; text-align: left; font: 600 15px var(--font-c); }
  .qt tr.none { color: var(--faint); }
  .qt .ago { display: block; color: var(--faint); font: 400 11px/1.1 var(--font-c); }
  .qt tr.sel { background: var(--sel); }
  .qt tr.sel th { box-shadow: inset 3px 0 0 var(--accent); }
  .qt tr.sel th button { color: var(--accent); }
  .sbar { display: inline-block; width: 28px; height: 5px; margin-right: 7px; border-radius: 3px; background: var(--raise-2); vertical-align: middle; overflow: hidden; }
  .sbar i { display: block; height: 100%; border-radius: 3px; background: var(--s-vol); }
  .qt tfoot th, .qt tfoot td { color: var(--muted); font-weight: 600; }

  /* Sinyal kartı (Borsa) — hesap özel sunucuda; burada yalnız sonuç gösterilir */
  .up { color: var(--up); }
  .down { color: var(--down); }
  .sg { padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .sg[aria-busy="true"] { opacity: 0.7; }
  .sg-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .sg-title { margin: 0; font-size: 16px; font-weight: 600; }
  .sg-when { font-size: 13px; color: var(--muted); }
  .sg-when.stale { color: var(--late); }
  .sg-empty { margin: 10px 0 2px; color: var(--muted); max-width: 70ch; }
  .sg-roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
  .sg-sec { grid-column: 1 / -1; margin: 6px 0 -2px; font: 600 12px var(--font-c); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sg-sec:first-child { margin-top: 0; }
  .sg-role { padding: 10px 12px 11px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  .sg-role[data-yon="up"] { border-color: color-mix(in srgb, var(--up) 40%, transparent); }
  .sg-role[data-yon="down"] { border-color: color-mix(in srgb, var(--down) 42%, transparent); }
  .sg-who { display: block; font-size: 13px; color: var(--muted); }
  .sg-verdict { display: flex; align-items: center; gap: 8px; margin-top: 2px; color: var(--text); }
  .sg-role[data-yon="up"] .sg-verdict { color: var(--up); }
  .sg-role[data-yon="down"] .sg-verdict { color: var(--down); }
  .sg-act { font: 600 30px/1.1 var(--font-c); letter-spacing: 0.01em; white-space: nowrap; }
  .sg-pow { font-size: 13px; color: var(--muted); }
  .sg-meter { display: inline-flex; gap: 3px; }
  .sg-meter i { width: 6px; height: 13px; border-radius: 2px; background: var(--raise-2); }
  .sg-meter i.on { background: currentColor; }
  /* En güçlü (üç çubuklu) sinyal: zemin flaş gibi ANINDA yanar, 1 sn içinde yavaşça söner, 2 sn sönük bekler; döngü 3 sn
     (saniyede 0,33 kez, yani titreşim sınırının çok altında). Süreleri değiştirmek için: döngü = sönme + bekleme;
     %33,33 = sönme ÷ döngü (1 ÷ 3). Çerçeve rengi hiç değişmez. Hareket azaltma ayarı açıksa animasyon çalışmaz. */
  @keyframes sg-nabiz { 0% { background-color: color-mix(in srgb, var(--nabiz) 24%, var(--bg)); animation-timing-function: ease-out; } 33.33%, 100% { background-color: var(--bg); } }
  .sg-role[data-guc="3"][data-yon="up"] { --nabiz: var(--up); animation: sg-nabiz 3s infinite; }
  .sg-role[data-guc="3"][data-yon="down"] { --nabiz: var(--down); animation: sg-nabiz 3s infinite; }
  @media (prefers-reduced-motion: reduce) { .sg-role[data-guc="3"] { animation: none; } }
  .sg-text { margin: 6px 0 0; font-size: 14px; line-height: 1.45; }
  .sg-exp { display: flex; flex-direction: column; gap: 3px; margin: 12px 2px 0; font-size: 15px; }
  .sg-exp b { font: 600 19px var(--font-c); font-variant-numeric: tabular-nums; }
  .sg-band { color: var(--muted); font-size: 13px; }
  .sg-hist { font-size: 13px; color: var(--muted); }
  .sg-why { margin: 10px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.45; }
  .sg-why li { margin: 3px 0; }
  .sg-why li::marker { color: var(--faint); }
  .sg-foot { margin: 10px 2px 0; font-size: 12.5px; line-height: 1.5; color: var(--faint); }
  .sg-foot a { color: var(--accent); }

  /* Sinyaller sayfası */
  .sy { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 980px; }
  .sy-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .sy-title { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.2; }
  .sy-when { margin: 3px 0 0; font-size: 14px; color: var(--muted); }
  .sy-when.stale { color: var(--late); }
  .sy-wind { padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .sy-wind:empty { display: none; }
  .sy-big { margin: 0 0 6px; font: 600 clamp(23px, 4.6vw, 32px)/1.15 var(--font-c); }
  .sy-big[data-yon="up"] { color: var(--up); }
  .sy-big[data-yon="down"] { color: var(--down); }
  .sy-line { margin: 4px 0 0; font-size: 14px; color: var(--muted); max-width: 76ch; }
  .sy-tabs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); overflow-x: auto; scrollbar-width: none; }
  .sy-tabs::-webkit-scrollbar, .sy-quals::-webkit-scrollbar { display: none; }
  .sy-tabs button { flex: 1 0 auto; height: 38px; padding: 0 12px; border-radius: 8px; color: var(--muted); font: 600 15px/1 var(--font-c); white-space: nowrap; }
  .sy-tabs button:hover { color: var(--text); }
  .sy-tabs button[aria-selected="true"] { background: var(--raise-2); color: var(--accent); }
  .sy-quals { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .sy-quals button { flex: none; min-width: 44px; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; font: 600 14px/1 var(--font-c); }
  .sy-quals button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .sy-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .sy-pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (min-width: 900px) {
    .sy { max-width: 1240px; }
    .sy-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .sy-block { padding: 14px 6px 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .sy-h2 { margin: 0 8px; font-size: 17px; font-weight: 600; }
  .sy-count { margin-left: 4px; color: var(--faint); font: 500 15px var(--font-c); }
  .sy-hint { margin: 4px 8px 10px; font-size: 13.5px; color: var(--muted); max-width: 76ch; }
  .sy-list { display: grid; }
  .sy-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "name act val" "why why why";
    gap: 2px 14px; align-items: center; width: 100%; padding: 9px 8px; border-top: 1px solid var(--row-line); text-align: left;
  }
  .sy-row:hover { background: var(--hover); }
  .sy-name { grid-area: name; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sy-act { grid-area: act; display: inline-flex; align-items: center; gap: 6px; font: 600 15px var(--font-c); white-space: nowrap; }
  .sy-act[data-yon="up"] { color: var(--up); }
  .sy-act[data-yon="down"] { color: var(--down); }
  .sy-val { grid-area: val; min-width: 62px; text-align: right; font: 600 15px var(--font-c); font-variant-numeric: tabular-nums; }
  .sy-why { grid-area: why; font-size: 13px; color: var(--muted); }
  .sy-why:empty { display: none; }
  .sy-dim { color: var(--faint); font-weight: 500; }
  .sy-more { margin: 8px 8px 2px; height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 9px; color: var(--accent); font-weight: 600; }
  .sy-empty { margin: 6px 8px 8px; color: var(--muted); }
  .sy-opt { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .sy-opt input { width: 18px; height: 18px; accent-color: var(--accent); }
  .sy-note { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--faint); max-width: 76ch; }
  .sy-karne { min-width: 0; }
  .sy-karne tbody tr { cursor: default; }
  .sy-karne th, .sy-karne td { height: auto; padding-top: 8px; padding-bottom: 8px; text-align: left; vertical-align: top; }
  .sy-karne tbody th { white-space: nowrap; }
  .sy-karne td b { display: block; white-space: nowrap; }
  .sy-sub { display: block; font: 400 13px var(--font); color: var(--muted); white-space: normal; }
  @media (max-width: 600px) {
    .sy-row { gap: 2px 10px; }
    .sg-roles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .sg-role { padding: 9px 10px 10px; }
    .sg-role:nth-child(n+3) { grid-column: 1 / -1; }
    .sg-verdict { flex-wrap: wrap; gap: 4px 7px; }
    .sg-act { font-size: 22px; }
    .sg-text { font-size: 13.5px; }
    .sy-tabs button { padding: 0 10px; font-size: 14px; }
  }

  /* Sıradaki modüller */
  .soon { max-width: 640px; padding: 40px 4px; }
  .soon h1 { margin: 0 0 10px; font-size: 26px; }
  .soon p { margin: 0 0 22px; color: var(--muted); line-height: 1.6; }
  .soon a { color: var(--accent); }

  /* Telefon: temel kurallardan sonra gelmeli */
  @media (max-width: 600px) {
    .plot { padding: 10px 8px 8px; }
    .ranges button { font-size: 14px; }
  }
  @media (max-width: 400px) { .ranges { gap: 0; padding: 2px; } .ranges button { font-size: 13px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#borsa">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 22l7-7 5 4 7-10 5 5" fill="none" style="stroke:var(--price)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    DentSimco
  </a>
  <nav class="modules" aria-label="Modüller">
    <a href="#borsa" data-nav="borsa">Borsa</a>
    <a href="#sinyal" data-nav="sinyal">Sinyaller</a>
    <a href="#uretim" data-nav="kar">Kâr Hesaplayıcı</a>
  </nav>
  <div class="realm" role="group" aria-label="Realm">
    <button type="button" data-realm="0" aria-pressed="true" title="Realm 1">R1</button>
    <button type="button" data-realm="1" aria-pressed="false" title="Realm 2">R2</button>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Görünüm" title="Görünüm"></button>
  </div>
  <a class="about" href="#hakkinda" data-nav="hakkinda">Hakkımızda</a>
</header>
<nav class="subnav" id="subnav" aria-label="Kâr Hesaplayıcı bölümleri">
  <a href="#yonetim/ekip" data-sub="yonetim">Yönetim</a>
  <a href="#uretim" data-sub="uretim">Üretim</a>
  <a href="#perakende" data-sub="perakende">Perakende</a>
</nav>
<main id="app"></main>
<noscript><p style="padding:20px">DentSimco için JavaScript açık olmalı.</p></noscript>

<script>
  // Eski tarayıcı yedeği: replaceChildren yoksa tanımla (eski Samsung Internet gibi).
  if (!Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function () {
      while (this.firstChild) this.removeChild(this.firstChild);
      for (var i = 0; i < arguments.length; i++) this.append(arguments[i]);
    };
  }
  // Yakalanmayan bir hata olursa ekranın altında kısa bir uyarı göster (telefonda konsol olmadığı için).
  (function () {
    var shown = false;
    function show(text) {
      if (shown || !document.body) return;
      shown = true;
      var box = document.createElement('div');
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;padding:10px 12px;border-radius:10px;background:var(--raise-2);color:var(--text);border:1px solid var(--line-3);font:13px/1.4 system-ui,sans-serif';
      var msg = document.createElement('span');
      msg.textContent = 'Bir hata oluştu: ' + String(text).slice(0, 160);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Kapat';
      btn.style.cssText = 'margin-left:10px;padding:4px 10px;border-radius:8px;border:1px solid var(--line-3);background:var(--raise);color:inherit';
      btn.onclick = function () { if (box.parentNode) box.parentNode.removeChild(box); };
      box.appendChild(msg);
      box.appendChild(btn);
      document.body.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var m = e && e.message ? e.message : 'bilinmeyen';
      if (/ResizeObserver/i.test(m)) return; // zararsız tarayıcı uyarısı
      show(m + (e && e.lineno ? ' (satır ' + e.lineno + ')' : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      show(r && r.message ? r.message : String(r));
    });
  })();
</script>
<script type="module">
  const app = document.getElementById('app');
  const realmButtons = [...document.querySelectorAll('[data-realm]')];
  const navLinks = [...document.querySelectorAll('[data-nav]')];
  const subNav = document.getElementById('subnav');
  const subLinks = [...subNav.querySelectorAll('[data-sub]')];
  import('./tema.js').then((m) => m.dugmeyiBagla(document.getElementById('theme-btn'))).catch(() => { /* tema düğmesi yüklenemezse site yine çalışır */ });
  import('./girdi.js').then((m) => m.girdiyiBagla()).catch(() => { /* yüklenemezse sayı kutuları eskisi gibi çalışır */ });
  import('./acilir.js').then((m) => m.acilirlariBagla()).catch(() => { /* yüklenemezse tarayıcının kendi listesi kullanılır */ });
  const CALC = new Set(['uretim', 'perakende', 'yonetim']); // Kâr Hesaplayıcı'nın bölümleri

  const MODULES = {
    borsa: () => import('./borsa.js').then((m) => m.mountBorsa),
    sinyal: () => import('./sinyal.js').then((m) => m.mountSinyal),
    uretim: () => import('./uretim.js').then((m) => m.mountUretim),
    yonetim: () => import('./yonetim.js').then((m) => m.mountYonetim),
    perakende: () => import('./perakende.js').then((m) => m.mountPerakende),
    hakkinda: () => import('./hakkinda.js').then((m) => m.mountHakkinda),
  };

  let realm = 0;
  try { realm = localStorage.getItem('dentsimco.realm') === '1' ? 1 : 0; } catch { realm = 0; }
  let current = null;
  let currentKey = null;
  let routeToken = 0;

  function paintRealm() {
    for (const b of realmButtons) b.setAttribute('aria-pressed', String(Number(b.dataset.realm) === realm));
  }
  for (const b of realmButtons) {
    b.addEventListener('click', () => {
      const next = Number(b.dataset.realm);
      if (next === realm) return;
      realm = next;
      try { localStorage.setItem('dentsimco.realm', String(realm)); } catch { /* gizli sekme */ }
      paintRealm();
      current?.setRealm(realm);
    });
  }

  async function route() {
    const head = location.hash.slice(1).split('/')[0]; // #uretim/binalar → uretim (alt sekmeyi modül okur)
    const key = MODULES[head] ? head : 'borsa';
    if (key === currentKey) return;
    const my = ++routeToken;
    currentKey = key;
    const top = CALC.has(key) ? 'kar' : key;
    for (const a of navLinks) {
      if (a.dataset.nav === top) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
    subNav.classList.toggle('on', CALC.has(key));
    for (const a of subLinks) {
      if (a.dataset.sub === key) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
    try {
      const mount = await MODULES[key]();
      if (my !== routeToken) return;
      current?.destroy();
      current = mount(app, { realm });
    } catch (e) {
      console.error(e);
      app.innerHTML = '<section class="soon"><h1>Sayfa açılamadı</h1><p>Dosyalardan biri yüklenemedi. Sayfayı yenile; düzelmezse birkaç dakika sonra tekrar dene.</p></section>';
      const detail = document.createElement('p'); // telefonda konsol olmadığı için hatanın kısa özeti ekranda görünür
      detail.style.cssText = 'opacity:.6;font-size:12px';
      detail.textContent = `Ayrıntı: ${e?.name || 'Hata'}: ${String(e?.message || e).slice(0, 140)}`;
      app.querySelector('.soon').append(detail);
    }
  }

  window.addEventListener('hashchange', route);
  paintRealm();
  route();
</script>
</body>
</html>

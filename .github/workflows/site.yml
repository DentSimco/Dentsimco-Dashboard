# DentSimco — Dashboard yayını (Firebase Hosting)
# public/, test/ ya da araclar/ klasörü veya firebase.json değişince kendiliğinden çalışır, 2-4 dakika sürer.
# Sıra: testler → kodu gizle (yalnız yayın kopyası; depodaki dosyalar okunur kalır) → gizlenmiş kodla testler → yayın.
# Herhangi bir adım hata verirse yayın yapılmaz, canlı site eski hâliyle kalır.
# Elle çalıştırmak için: Actions > DentSimco Site > Run workflow
# Adres: https://dentsimco-e1c85.web.app
#
# Güvenlik:
#  • İki ayrı iş: "hazirla" npm paketi kurar ama gizli anahtarı HİÇ görmez; "yayinla" anahtarı görür ama npm paketi kurmaz.
#  • npm paketi sabit sürümle ve kurulum betikleri kapalı (--ignore-scripts) kurulur.
#  • GitHub eylemleri değişmez commit numarasıyla (SHA), firebase-tools sabit sürümle çağrılır.
#  • Yayın anahtarı FIREBASE_HOSTING_JSON yalnız "Firebase Hosting Admin" rolündeki ayrı bir hesaba aittir; Firestore'a yazamaz.
name: DentSimco Site

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'test/**'
      - 'araclar/**'
      - 'firebase.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentsimco-site
  cancel-in-progress: true

jobs:
  hazirla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: |
            public
            test
            araclar

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Hazırlık
        run: |
          [ -f package.json ] || echo '{"type":"module"}' > package.json
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund javascript-obfuscator@4.2.1

      - name: Testler (okunur kod)
        run: |
          n=0
          for f in test/*.mjs; do
            [ -e "$f" ] || continue
            case "$f" in *veri-ornek*) continue ;; esac
            if ! node "$f" > /tmp/test.txt 2>&1; then cat /tmp/test.txt; echo "::error::Test başarısız: $f"; exit 1; fi
            echo "$f: $(tail -1 /tmp/test.txt)"; n=$((n+1))
          done
          [ "$n" -gt 0 ] || echo "::warning::test/ klasöründe test bulunamadı; yalnız gizleme denetimi çalışacak."

      - name: Kodu gizle
        run: node araclar/gizle.mjs

      - name: Testler (gizlenmiş kod; hesaplar aynı mı)
        run: |
          n=0
          for f in test/*.mjs; do
            [ -e "$f" ] || continue
            case "$f" in *veri-ornek*) continue ;; esac
            if ! node "$f" > /tmp/test.txt 2>&1; then cat /tmp/test.txt; echo "::error::Test başarısız: $f"; exit 1; fi
            echo "$f: $(tail -1 /tmp/test.txt)"; n=$((n+1))
          done
          [ "$n" -gt 0 ] || echo "::warning::test/ klasöründe test bulunamadı; yalnız gizleme denetimi çalışacak."

      - name: Yayın kopyasını sakla
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: |
            public
            firebase.json
          retention-days: 3
          if-no-files-found: error

  yayinla:
    needs: hazirla
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Yayın kopyasını al
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site

      - name: Firebase Hosting'e yayınla
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_HOSTING_JSON }}
          projectId: dentsimco-e1c85
          channelId: live
          firebaseToolsVersion: 15.32.1

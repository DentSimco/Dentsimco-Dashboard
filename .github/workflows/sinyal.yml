# DentSimco — Sinyal motoru
# İki çalışma şekli:
#   gece    Her gece 01:20 UTC'de (04:20 TR) botun gece özetinden sonra: tam hesap (sinyaller, karne, olay ve evre arşivi).
#   gunici  Gün boyu saatte bir (00:20, 02:20, 03:20 ... 23:20 UTC; 01:20 gece çalışmasınındır): meta/sinyal_r{0,1} ve gün içi
#           karne kaydı yazılır. Likit ve son işlemi ≤6 saat önce olan ürün×kalitede canlı son işlem fiyatıyla yeniden hesaplanır.
#           Fiyat hedefe ulaşır, 20 günlük tepeyi ya da dibi kırarsa sinyal beklemeden yenilenir (motor.mjs başı).
#           Gece çalışması ayrıca Optimum Seviye sayfası için meta/optimum_r0 belgesini (son 28 günün borsa özeti, yalnız
#           Realm 0; sinyal/optimum.mjs) ve İndeks sayfası için meta/endeks_r{0,1} belgelerini (piyasa endeksinin gün gün ve
#           hafta hafta dökümü; sinyal/endeks.mjs) yazar. Özet hesaplanamazsa sinyaller yine yazılır, son iyi özet yayında kalır.
# Her çalışma 1-2 dakika sürür. Sıra: sınamalar → sinyalleri hesapla → Firestore'a yalnız sonuçları yaz. Sınama geçmezse hiçbir şey yazılmaz.
# Elle çalıştırmak için: Actions > DentSimco Sinyal > Run workflow (şekil seçilir; yeni sürümü ilk kurarken önce "gece" çalıştır).
# Okuma maliyeti: her çalışma yaklaşık 600 Firestore belgesi okur (saatte bir ≈ 14 bin/gün).
#
# Güvenlik: yalnız FIREBASE_BOT_JSON kullanılır ("Cloud Datastore User" rolündeki hesap). Site yayın anahtarına
# (FIREBASE_HOSTING_JSON) geri dönülmez. GitHub eylemleri değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Sinyal

on:
  schedule:
    - cron: '20 1 * * *'
    - cron: '20 0,2-23 * * *'
  workflow_dispatch:
    inputs:
      mod:
        description: 'gece = tam hesap ve karne, gunici = yalnız canlı fiyatla yeniden hesap'
        type: choice
        options:
          - gece
          - gunici
        default: gece

permissions:
  contents: read

concurrency:
  group: dentsimco-sinyal
  cancel-in-progress: false

jobs:
  sinyal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SINYAL_MOD: ${{ github.event_name == 'workflow_dispatch' && inputs.mod || (github.event.schedule == '20 1 * * *' && 'gece' || 'gunici') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: sinyal

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Sınamalar
        run: |
          node sinyal/motor_test.mjs
          node sinyal/optimum_test.mjs
          node sinyal/endeks_test.mjs
          node sinyal/firestore_test.mjs

      - name: Sinyalleri hesapla ve yaz (${{ env.SINYAL_MOD }})
        run: node sinyal/motor.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_BOT_JSON }}
